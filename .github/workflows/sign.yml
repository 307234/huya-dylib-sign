name: Sign dylib
on:
  workflow_dispatch:  # 手动触发
  push:
    paths: ["HUYA_1.9_patched.dylib"]
jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git libplist-dev libssl-dev
      - name: Build ldid
        run: |
          git clone https://github.com/xerub/ldid.git
          cd ldid
          make
      - name: Ad-hoc sign
        run: ./ldid/ldid -S HUYA_1.9_patched.dylib
      - name: Verify
        run: ./ldid/ldid -e HUYA_1.9_patched.dylib
      - name: Upload signed dylib
        uses: actions/upload-artifact@v4
        with:
          name: HUYA_1.9_signed
          path: HUYA_1.9_patched.dylib
