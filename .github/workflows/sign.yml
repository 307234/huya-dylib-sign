name: Sign dylib
on:
  workflow_dispatch:  # 手动触发
  push:
    paths: ["HUYA_1.9_patched.dylib"]
jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ldid
        run: |
          sudo apt-get update
          sudo apt-get install -y ldid
      - name: Ad-hoc sign
        run: ldid -S HUYA_1.9_patched.dylib
      - name: Verify
        run: ldid -e HUYA_1.9_patched.dylib
      - name: Upload signed dylib
        uses: actions/upload-artifact@v4
        with:
          name: HUYA_1.9_signed
          path: HUYA_1.9_patched.dylib
